[pytest]
addopts = -ra --strict-markers --tb=short
log_cli = true
log_cli_level = INFO
junit_family = xunit2
testpaths = tests
markers =
    smoke: fast, critical-path checks
    auth: authentication checks
    boards: board-management checks
    regression: broader functional coverage
    api: backend/API contract checks
    permissions: role and access-control checks
