[pytest]
addopts = -ra --strict-markers --tb=short
log_cli = true
log_cli_level = INFO
junit_family = xunit2
testpaths = tests
markers =
    smoke: fast, critical-path checks
    auth: authentication checks
    boards: board-management checks
    regression: broader functional coverage
    api: backend/API contract checks
    permissions: role and access-control checks
    public: public landing, pricing and account-entry checks
    cards: card creation, detail and lifecycle checks
    reports: dashboards and export checks
    notifications: in-app notification checks
    profile: account preferences and profile checks
    integrations: external integration checks
    accessibility: WCAG-oriented checks
    responsive: viewport and reflow checks
    security: security regression checks
    destructive: tests that delete or permanently mutate data
    serial: tests that must not run in parallel
    case_id(id): links an automated test to its manual test-data record
