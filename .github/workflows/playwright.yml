name: Playwright quality gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate framework
        run: |
          python -m ruff check .
          python -m compileall -q conftest.py clients config pages scripts test_data tests utils
          python -m pip check
          pytest tests/unit -q
          pytest --collect-only -q --traceability-output=reports/traceability
      - name: Upload traceability
        uses: actions/upload-artifact@v4
        with:
          name: automation-traceability
          path: reports/traceability.*
          if-no-files-found: error
          retention-days: 30

  api-contracts:
    needs: quality-gates
    runs-on: ubuntu-latest
    env:
      TEST_ENVIRONMENT: staging
      API_BASE_URL: ${{ secrets.SNAGLY_API_BASE_URL }}
      BASE_URL: ${{ secrets.SNAGLY_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.SNAGLY_TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.SNAGLY_TEST_USER_PASSWORD }}
      TEAM_USER_EMAIL: ${{ secrets.SNAGLY_TEAM_USER_EMAIL }}
      TEAM_USER_PASSWORD: ${{ secrets.SNAGLY_TEAM_USER_PASSWORD }}
      CLIENT_USER_EMAIL: ${{ secrets.SNAGLY_CLIENT_USER_EMAIL }}
      CLIENT_USER_PASSWORD: ${{ secrets.SNAGLY_CLIENT_USER_PASSWORD }}
      OTHER_OWNER_EMAIL: ${{ secrets.SNAGLY_OTHER_OWNER_EMAIL }}
      OTHER_OWNER_PASSWORD: ${{ secrets.SNAGLY_OTHER_OWNER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.SNAGLY_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.SNAGLY_ADMIN_PASSWORD }}
      TEST_RUN_ID: api-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check live-test configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$BASE_URL" && -n "$API_BASE_URL" && -n "$TEST_USER_EMAIL" && -n "$TEST_USER_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::API tests skipped because staging API/Owner secrets are not configured."
          fi
      - name: Run API contracts
        if: steps.config.outputs.ready == 'true'
        run: pytest -m api --junitxml=reports/api-junit.xml --html=reports/api.html --self-contained-html
      - name: Upload API evidence
        if: ${{ !cancelled() && steps.config.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-evidence
          path: reports/
          if-no-files-found: error
          retention-days: 14

  ui-smoke:
    needs: quality-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    env:
      TEST_ENVIRONMENT: staging
      BASE_URL: ${{ secrets.SNAGLY_BASE_URL }}
      API_BASE_URL: ${{ secrets.SNAGLY_API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.SNAGLY_TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.SNAGLY_TEST_USER_PASSWORD }}
      TEAM_USER_EMAIL: ${{ secrets.SNAGLY_TEAM_USER_EMAIL }}
      TEAM_USER_PASSWORD: ${{ secrets.SNAGLY_TEAM_USER_PASSWORD }}
      CLIENT_USER_EMAIL: ${{ secrets.SNAGLY_CLIENT_USER_EMAIL }}
      CLIENT_USER_PASSWORD: ${{ secrets.SNAGLY_CLIENT_USER_PASSWORD }}
      OTHER_OWNER_EMAIL: ${{ secrets.SNAGLY_OTHER_OWNER_EMAIL }}
      OTHER_OWNER_PASSWORD: ${{ secrets.SNAGLY_OTHER_OWNER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.SNAGLY_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.SNAGLY_ADMIN_PASSWORD }}
      TEST_RUN_ID: ui-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps ${{ matrix.browser }}
      - name: Check live-test configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$BASE_URL" && -n "$API_BASE_URL" && -n "$TEST_USER_EMAIL" && -n "$TEST_USER_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UI smoke skipped because staging URL/API/Owner secrets are not configured."
          fi
      - name: Run UI smoke
        if: steps.config.outputs.ready == 'true'
        run: >-
          pytest -m smoke --browser ${{ matrix.browser }}
          --tracing retain-on-failure --screenshot only-on-failure
          --junitxml=reports/smoke-${{ matrix.browser }}.xml
          --html=reports/smoke-${{ matrix.browser }}.html --self-contained-html
      - name: Upload UI evidence
        if: ${{ !cancelled() && steps.config.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.browser }}-evidence
          path: |
            test-results/
            reports/
          if-no-files-found: error
          retention-days: 14

  cross-browser-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      TEST_ENVIRONMENT: staging
      BASE_URL: ${{ secrets.SNAGLY_BASE_URL }}
      API_BASE_URL: ${{ secrets.SNAGLY_API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.SNAGLY_TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.SNAGLY_TEST_USER_PASSWORD }}
      TEAM_USER_EMAIL: ${{ secrets.SNAGLY_TEAM_USER_EMAIL }}
      TEAM_USER_PASSWORD: ${{ secrets.SNAGLY_TEAM_USER_PASSWORD }}
      CLIENT_USER_EMAIL: ${{ secrets.SNAGLY_CLIENT_USER_EMAIL }}
      CLIENT_USER_PASSWORD: ${{ secrets.SNAGLY_CLIENT_USER_PASSWORD }}
      OTHER_OWNER_EMAIL: ${{ secrets.SNAGLY_OTHER_OWNER_EMAIL }}
      OTHER_OWNER_PASSWORD: ${{ secrets.SNAGLY_OTHER_OWNER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.SNAGLY_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.SNAGLY_ADMIN_PASSWORD }}
      TEST_RUN_ID: nightly-${{ github.run_id }}-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps ${{ matrix.browser }}
      - name: Run cross-browser smoke
        if: env.BASE_URL != '' && env.API_BASE_URL != '' && env.TEST_USER_EMAIL != '' && env.TEST_USER_PASSWORD != ''
        run: >-
          pytest -m smoke --browser ${{ matrix.browser }}
          --tracing retain-on-failure --screenshot only-on-failure
          --junitxml=reports/smoke-${{ matrix.browser }}.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nightly-${{ matrix.browser }}-evidence
          path: |
            test-results/
            reports/
          if-no-files-found: ignore
          retention-days: 14

  regression-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality-gates
    runs-on: ubuntu-latest
    env:
      TEST_ENVIRONMENT: staging
      BASE_URL: ${{ secrets.SNAGLY_BASE_URL }}
      API_BASE_URL: ${{ secrets.SNAGLY_API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.SNAGLY_TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.SNAGLY_TEST_USER_PASSWORD }}
      TEAM_USER_EMAIL: ${{ secrets.SNAGLY_TEAM_USER_EMAIL }}
      TEAM_USER_PASSWORD: ${{ secrets.SNAGLY_TEAM_USER_PASSWORD }}
      CLIENT_USER_EMAIL: ${{ secrets.SNAGLY_CLIENT_USER_EMAIL }}
      CLIENT_USER_PASSWORD: ${{ secrets.SNAGLY_CLIENT_USER_PASSWORD }}
      OTHER_OWNER_EMAIL: ${{ secrets.SNAGLY_OTHER_OWNER_EMAIL }}
      OTHER_OWNER_PASSWORD: ${{ secrets.SNAGLY_OTHER_OWNER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.SNAGLY_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.SNAGLY_ADMIN_PASSWORD }}
      TEST_RUN_ID: regression-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Run Chromium regression
        if: env.BASE_URL != '' && env.API_BASE_URL != '' && env.TEST_USER_EMAIL != '' && env.TEST_USER_PASSWORD != ''
        run: >-
          pytest -m "regression and not destructive" --browser chromium
          --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure
          --junitxml=reports/regression.xml --html=reports/regression.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nightly-regression-evidence
          path: |
            test-results/
            reports/
          if-no-files-found: ignore
          retention-days: 14
